openapi: 3.0.3
info:
  title: School Management API - EduGest
  description: |
    API REST complète pour la gestion des écoles primaires et maternelles.
    Basée sur les spécifications du document EduGest.
    
    Cette documentation est ordonnée **strictement par ordre d'exécution** (dépendances).
    Veuillez suivre cet ordre pour vos tests afin d'éviter les erreurs de clés étrangères.
    
    **Rôles Admin :**
    - `0` Root Admin, `1` Admin général, `2` Fondateur, `3` Directeur
    
    **Rôles Personnes :**
    - `1` Enseignant, `2` Administratif, `3` Scolarité, `4` Parent
  version: 2.0.0

servers:
  - url: http://localhost:5000/api
    description: Serveur Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

tags:
  - name: 1. Authentification
  - name: 2. Structure Académique
  - name: 3. Structure Pédagogique
  - name: 4. Scolarité & Élèves
  - name: 5. Utilisateurs
  - name: 6. Vie Scolaire
  - name: 7. Évaluations
  - name: 8. Finance

paths:
  # ==========================================
  # 1. AUTHENTIFICATION
  # ==========================================
  /auth/login:
    post:
      tags: [1. Authentification]
      summary: Connexion d'un utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                userType: { type: string, enum: [admin, personne] }
      responses:
        '200': { description: Succès }
  
  /auth/me:
    get:
      tags: [1. Authentification]
      summary: Profil de l'utilisateur connecté
      responses:
        '200': { description: Succès }

  # ==========================================
  # 2. STRUCTURE ACADEMIQUE
  # ==========================================
  /annees:
    post:
      tags: [2. Structure Académique]
      summary: Créer une Année Académique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "2025-2026" }
                periode: { type: string, example: "Sept 2025 - Juin 2026" }
      responses:
        '201': { description: Succès }
    get:
      tags: [2. Structure Académique]
      summary: Lister les Années Académiques
      responses:
        '200': { description: Succès }
        
  /annees/{idAnnee}:
    put:
      tags: [2. Structure Académique]
      summary: Modifier une Année Académique
      parameters: [{ name: idAnnee, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Succès } }
    delete:
      tags: [2. Structure Académique]
      summary: Supprimer une Année Académique
      parameters: [{ name: idAnnee, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Succès } }

  /trimestres:
    post:
      tags: [2. Structure Académique]
      summary: Créer un Trimestre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "Premier Trimestre" }
                periode: { type: string, example: "Septembre - Décembre" }
                idAca: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [2. Structure Académique]
      summary: Lister les Trimestres
      responses:
        '200': { description: Succès }

  # ==========================================
  # 3. STRUCTURE PEDAGOGIQUE
  # ==========================================
  /cycles:
    post:
      tags: [3. Structure Pédagogique]
      summary: Créer un Cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "Cycle 2" }
                description: { type: string, example: "Apprentissages fondamentaux" }
      responses:
        '201': { description: Succès }
    get:
      tags: [3. Structure Pédagogique]
      summary: Lister les Cycles
      responses:
        '200': { description: Succès }

  /classes:
    post:
      tags: [3. Structure Pédagogique]
      summary: Créer une Classe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "CE1 A" }
                idCycle: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [3. Structure Pédagogique]
      summary: Lister les Classes
      responses:
        '200': { description: Succès }

  /salles:
    post:
      tags: [3. Structure Pédagogique]
      summary: Créer une Salle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "Salle 102" }
                position: { type: string, example: "Bâtiment A" }
                surface: { type: string, example: "50m2" }
                idClasse: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [3. Structure Pédagogique]
      summary: Lister les Salles
      responses:
        '200': { description: Succès }

  /cours:
    post:
      tags: [3. Structure Pédagogique]
      summary: Créer un Cours (Matière)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "Mathématiques" }
                coefficient: { type: number, example: 2 }
                note: { type: number, example: 20 }
                idClasse: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [3. Structure Pédagogique]
      summary: Lister les Cours
      responses:
        '200': { description: Succès }

  # ==========================================
  # 4. SCOLARITE & ELEVES
  # ==========================================
  /scolarites:
    post:
      tags: [4. Scolarité & Élèves]
      summary: Configurer la Scolarité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inscription: { type: number, example: 10000 }
                pension: { type: number, example: 50000 }
                idCycle: { type: integer, example: 1 }
                nbreTranche: { type: integer, example: 3 }
      responses:
        '201': { description: Succès }
    get:
      tags: [4. Scolarité & Élèves]
      summary: Lister la configuration des scolarités
      responses: { '200': { description: Succès } }

  /eleves:
    post:
      tags: [4. Scolarité & Élèves]
      summary: Inscrire un Élève
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom: { type: string, example: "Dupont" }
                prenom: { type: string, example: "Jean" }
                dateNaissance: { type: string, format: date, example: "2015-05-12" }
                lieuNaissance: { type: string, example: "Paris" }
                sexe: { type: integer, example: 1, description: "0=Fille, 1=Garçon" }
                idVilleNaissance: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [4. Scolarité & Élèves]
      summary: Lister les Élèves
      responses:
        '200': { description: Succès }
        
  /eleves/{matricule}:
    get:
      tags: [4. Scolarité & Élèves]
      summary: Obtenir les détails d'un élève
      parameters: [{ name: matricule, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Succès } }
    put:
      tags: [4. Scolarité & Élèves]
      summary: Modifier un élève
      parameters: [{ name: matricule, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Succès } }
    delete:
      tags: [4. Scolarité & Élèves]
      summary: Supprimer un élève
      parameters: [{ name: matricule, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Succès } }
      
  /eleves/{matricule}/statut:
    patch:
      tags: [4. Scolarité & Élèves]
      summary: Activer ou désactiver un élève
      parameters: [{ name: matricule, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actif: { type: integer, example: 1 }
      responses: { '200': { description: Succès } }

  # ==========================================
  # 5. UTILISATEURS (PERSONNEL & PARENTS)
  # ==========================================
  /enseignants:
    post:
      tags: [5. Utilisateurs]
      summary: Créer un Enseignant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom: { type: string, example: "Martin" }
                prenom: { type: string, example: "Paul" }
                dateNaissance: { type: string, format: date, example: "1980-08-20" }
                lieuNaissance: { type: string, example: "Lyon" }
                username: { type: string, example: "pmartin" }
                password: { type: string, example: "password123" }
                idCours: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [5. Utilisateurs]
      summary: Lister les Enseignants
      responses: { '200': { description: Succès } }

  /parents:
    post:
      tags: [5. Utilisateurs]
      summary: Créer un Parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom: { type: string, example: "Dupont" }
                prenom: { type: string, example: "Michel" }
                dateNaissance: { type: string, format: date, example: "1975-02-15" }
                lieuNaissance: { type: string, example: "Paris" }
                username: { type: string, example: "mdupont" }
                password: { type: string, example: "password123" }
                matricule: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [5. Utilisateurs]
      summary: Lister les Parents
      responses: { '200': { description: Succès } }

  # ==========================================
  # 6. VIE SCOLAIRE
  # ==========================================
  /emplois:
    post:
      tags: [6. Vie Scolaire]
      summary: Assigner un horaire (Emploi du temps)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jour: { type: string, example: "Lundi" }
                heure: { type: string, example: "08:00" }
                idClasse: { type: integer, example: 1 }
                idCours: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [6. Vie Scolaire]
      summary: Voir les emplois du temps
      responses: { '200': { description: Succès } }

  /titulaires:
    post:
      tags: [6. Vie Scolaire]
      summary: Assigner un professeur principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idPers: { type: integer, example: 1 }
                idSalle: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [6. Vie Scolaire]
      summary: Lister les professeurs titulaires
      responses: { '200': { description: Succès } }

  /notifications:
    post:
      tags: [6. Vie Scolaire]
      summary: Envoyer une Notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objet: { type: string, example: "Réunion Parents-Profs" }
                information: { type: string, example: "La réunion aura lieu vendredi à 18h." }
                type_message: { type: integer, example: 1, description: "1 = Tous les parents" }
      responses:
        '201': { description: Succès }
    get:
      tags: [6. Vie Scolaire]
      summary: Voir les notifications
      responses: { '200': { description: Succès } }

  # ==========================================
  # 7. EVALUATIONS
  # ==========================================
  /sessions:
    post:
      tags: [7. Évaluations]
      summary: Créer une Session d'évaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libelle: { type: string, example: "Séquence 1" }
                description: { type: string, example: "Evaluation de mi-trimestre" }
                idTrimestre: { type: integer, example: 1 }
                idPers: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [7. Évaluations]
      summary: Lister les Sessions
      responses: { '200': { description: Succès } }

  /evaluations:
    post:
      tags: [7. Évaluations]
      summary: Saisir une note (Évaluation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: number, example: 15.5 }
                appreciation: { type: string, example: "Bon travail" }
                matricule: { type: integer, example: 1 }
                idEpreuve: { type: integer, example: 1 }
                idCours: { type: integer, example: 1 }
                idSession: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [7. Évaluations]
      summary: Lister les Notes
      responses: { '200': { description: Succès } }

  /bulletins/generate/{matricule}/{idSession}:
    post:
      tags: [7. Évaluations]
      summary: Générer un bulletin
      parameters:
        - name: matricule
          in: path
          required: true
          schema:
            type: integer
        - name: idSession
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200': { description: Succès }

  # ==========================================
  # 8. FINANCE
  # ==========================================
  /paiements:
    post:
      tags: [8. Finance]
      summary: Enregistrer un paiement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matricule: { type: integer, example: 1 }
                idAca: { type: integer, example: 1 }
                montant: { type: number, example: 5000 }
                comentaire: { type: string, example: "Tranche 1" }
      responses:
        '201': { description: Succès }
    get:
      tags: [8. Finance]
      summary: Lister les paiements
      responses: { '200': { description: Succès } }

  /salaires:
    post:
      tags: [8. Finance]
      summary: Verser un salaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                montant: { type: number, example: 150000 }
                mois: { type: integer, example: 10 }
                idPers: { type: integer, example: 1 }
                idAca: { type: integer, example: 1 }
      responses:
        '201': { description: Succès }
    get:
      tags: [8. Finance]
      summary: Lister les salaires
      responses: { '200': { description: Succès } }

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    Success:
      type: object
      properties:
        message:
          type: string
